[project]
name = "portfolio-agents-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "google-genai>=1.0",
  "python-dotenv>=1.0",
  "yfinance>=0.2.40",
  "pandas>=2.2,<3",      # vendored Vibe-Trading code + yfinance break on pandas 3
  "numpy>=1.26",
  "scipy>=1.12",          # vendored risk-parity optimizer
  "requests>=2.31",       # vendored OKX / SEC loaders
  "pyarrow>=16",          # parquet price cache
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
